name: Release

# Pushing a tag like v0.1.0 publishes the gem to RubyGems.org with trusted publishing (OIDC).
# No API key is stored in this repository. See PUBLISH.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@e65c17d16e57e481586a6a5a0282698790062f92 # v1.300.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -Ilib -e 'require "looot/version"; print Looot::VERSION')
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: bundle exec rspec
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
